name: Build RarX

# Đẩy mã lên nhánh main  → biên dịch thử và lưu bản dựng (Artifacts).
# Phát hành bản mới (chọn một cách):
#   1) Tab Actions ▸ Build RarX ▸ Run workflow ▸ bấm nút xanh. Mặc định tự phát hành bản ghi trong build.sh
#      (VERSION=…), có thể điền số khác ở ô release_version; bỏ tích “publish” nếu chỉ muốn build thử.
#   2) Tạo Release trên GitHub với tag dạng v1.2.0 (chữ v + số) ▸ Publish: workflow tự build và đính kèm tệp.
# Chức năng “Cập nhật” trong ứng dụng đọc Release mới nhất và tải tệp .zip đính kèm.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Số phiên bản, ví dụ 1.2.0 (để trống = dùng VERSION trong build.sh)"
        required: false
        default: ""
      publish:
        description: "Phát hành lên GitHub Releases (bỏ tích = chỉ build thử)"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Xác định phiên bản
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          DEFAULT_VERSION="$(sed -nE 's/^VERSION="\$\{VERSION:-([0-9.]+)\}"/\1/p' build.sh | head -1)"
          PUBLISH=false
          if [[ "$EVENT" == "release" ]]; then
            TAG="$RELEASE_TAG"
            VERSION="${TAG#[vV]}"
            PUBLISH=true
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
            VERSION="${VERSION#[vV]}"
            TAG="v$VERSION"
            [[ "${INPUT_PUBLISH:-true}" == "true" ]] && PUBLISH=true
          else
            VERSION="$DEFAULT_VERSION"
            TAG="v$VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Phiên bản không hợp lệ: '$VERSION'. Tên tag/phiên bản phải có dạng v1.2.0 (chữ v + số, ví dụ v1.1.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Phiên bản: $VERSION · tag: $TAG · phát hành: $PUBLISH"
          xcodebuild -version
          swift --version

      - name: Biên dịch (Apple Silicon + Intel)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh --universal --dmg --zip

      - name: Kiểm tra gói
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rarx-check && mkdir -p /tmp/rarx-check
          ditto -x -k build/RarX.zip /tmp/rarx-check
          APP="/tmp/rarx-check/RarX.app"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleIdentifier"
          lipo -archs "$APP/Contents/MacOS/RarX"
          codesign --verify --deep --strict "$APP"
          ls "$APP/Contents/Resources" | head -30
          "$APP/Contents/MacOS/7zz" | head -3 || true

      - name: Đặt tên tệp theo phiên bản
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd build
          mv RarX.zip "RarX-${VERSION}.zip"
          mv RarX.dmg "RarX-${VERSION}.dmg"
          shasum -a 256 "RarX-${VERSION}.zip" "RarX-${VERSION}.dmg" > SHA256SUMS.txt
          ls -la

      - name: Lưu bản dựng
        uses: actions/upload-artifact@v4
        with:
          name: RarX-${{ steps.ver.outputs.version }}
          path: |
            build/RarX-*.zip
            build/RarX-*.dmg
            build/SHA256SUMS.txt

      - name: Phát hành trên GitHub
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RarX ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          append_body: true
          body: |
            **Cài đặt:** tải `RarX-${{ steps.ver.outputs.version }}.dmg`, kéo RarX vào thư mục Ứng dụng.
            Lần đầu mở: chuột phải vào RarX ▸ **Mở** (ứng dụng chưa được Apple công chứng).
            Người đang dùng RarX chỉ cần mở **RarX ▸ Kiểm tra cập nhật…** rồi bấm **Cập nhật ngay**.
          files: |
            build/RarX-*.zip
            build/RarX-*.dmg
            build/SHA256SUMS.txt
